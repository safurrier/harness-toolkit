name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Check
        run: mise run ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  smoke-test:
    name: Init Smoke Test (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: python
            name: smokepy
          - stack: go
            name: smokego
          - stack: rust
            name: smokerust
          - stack: web
            name: smokeweb
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup scaffold
        run: mise run setup

      - name: Init non-interactive (${{ matrix.stack }} single)
        run: mise run init -- --non-interactive --name ${{ matrix.name }} --shape single --stack ${{ matrix.stack }} --no-hooks

      - name: Trust generated mise config
        run: mise trust .mise.toml

      - name: Setup generated project
        run: mise run setup

      - name: Check generated project
        run: mise run check

  verify:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Verify
        run: mise run verify
