site_name: harness-toolkit
site_description: Harness Engineering Toolkit for agent-ready repositories
site_url: https://safurrier.github.io/harness-toolkit
repo_url: https://github.com/safurrier/harness-toolkit
repo_name: safurrier/harness-toolkit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Explanation:
      - "Harness Kit: Dumb Tasks, Smart Agents": explanation/harness-kit-what-and-why.md
      - Portable Workflow: explanation/portable-workflow.md
      - Harness Kit Design: explanation/harness-kit-lifecycle-design.md
      - System Map Mental Model: explanation/system-map-mental-model.md
      - Repo Shapes: explanation/shapes.md
      - Init System: explanation/init-system.md
      - CI & Hooks: explanation/ci.md
      - Scripts Contract Prototype: explanation/script-contract-prototype.md
  - How-to:
      - Getting Started: how-to/getting-started.md
      - Agent Adoption: how-to/agent-adoption.md
      - Profile Reviews: how-to/profile-reviews.md
      - Profile Authoring: how-to/profile-authoring.md
      - System Map Authoring: how-to/system-map-authoring.md
      - Development: how-to/development.md
      - Release and Installation: how-to/release.md
  - Reference:
      - Task Contract: reference/task-contract.md
      - Stacks:
          - Overview: reference/stacks/index.md
          - Acceptance Rubric: reference/stacks/acceptance-rubric.md
          - Python: reference/stacks/python.md
          - Go: reference/stacks/go.md
          - Rust: reference/stacks/rust.md
          - Web: reference/stacks/web.md
          - Visual starters: reference/stacks/visual.md
      - Decisions:
          - ADR 0001 — Spec-Driven Decision Loop: reference/decisions/0001-spec-driven-decision-loop.md
          - ADR 0002 — Plan Workflow: reference/decisions/0002-plan-workflow.md
          - ADR 0003 — Deterministic Slice Contract: reference/decisions/0003-deterministic-slice-contract.md
          - ADR 0004 — Skill-First Slice Workflow: reference/decisions/0004-skill-first-slice-workflow.md
          - ADR 0005 — Harden Sync Contract CI: reference/decisions/0005-harden-sync-contract-ci.md
          - ADR 0006 — Plan Contract Modules and Stack Rubric: reference/decisions/0006-followup-contract-stack-rubric.md
          - ADR 0007 — Harness Engineering Toolkit Naming: reference/decisions/0007-harness-toolkit-naming.md
          - ADR 0008 — Harness Kit Ledger-First Local Assistant: reference/decisions/0008-harness-kit-ledger-first-local-assistant.md
          - ADR 0009 — Harness Kit Lifecycle-First CLI: reference/decisions/0009-harness-kit-lifecycle-first-cli.md
          - ADR 0010 — Compact HK Export Packages: reference/decisions/0010-compact-hk-export-packages.md
          - ADR 0011 — Path-Aware Review Freshness: reference/decisions/0011-path-aware-review-freshness.md
          - ADR 0012 — Lifecycle-Neutral Active HK Exports: reference/decisions/0012-lifecycle-neutral-active-hk-exports.md
          - ADR 0013 — Web Stack V0: reference/decisions/0013-web-stack-v0.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
