[project]
name = "harness-toolkit"
version = "0.3.0"
description = "Harness Engineering Toolkit for agent-ready repositories"
readme = "README.md"
authors = [{ name = "Alex Furrier" }]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=3.0",
    "jinja2>=3.0",
    "pathspec>=0.12",
]

[project.scripts]
harness-scaffold = "harness_toolkit.scaffold.cli:main"
harness-kit = "harness_toolkit.kit.cli:main"
hk = "harness_toolkit.kit.cli:main"

[project.urls]
Homepage = "https://github.com/safurrier/harness-toolkit"
Documentation = "https://safurrier.github.io/harness-toolkit"
Repository = "https://github.com/safurrier/harness-toolkit"
Issues = "https://github.com/safurrier/harness-toolkit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "mkdocs-material>=9.5",
    "ruff>=0.9",
    "ty>=0.0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_toolkit"]

# Scaffold runtime files live at the repository root during development. Map them
# into the installed package so harness-scaffold can find every shipped template.
[tool.hatch.build.targets.wheel.force-include]
".mise" = "harness_toolkit/scaffold/resources/.mise"
"scripts" = "harness_toolkit/scaffold/resources/scripts"
"stacks" = "harness_toolkit/scaffold/resources/stacks"
"templates" = "harness_toolkit/scaffold/resources/templates"

# ── Ruff ─────────────────────────────────────
[tool.ruff]
extend-exclude = ["stacks/", "templates/", ".agent/skills/"]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "S101"]

# ── Pytest ───────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-n auto --dist=loadfile"
markers = [
    "contract: structural checks on the scaffold itself (fast)",
    "unit: pure function tests with no subprocess Git/uv where possible (fast)",
    "integration: real temp repos, filesystem state, or adapter behavior below the public CLI",
    "cli: black-box public CLI entrypoint coverage",
    "agent_sim: scripted fake-agent journeys through the public hk CLI",
    "e2e: full init+setup+check workflows against temp projects",
    "slow: tests that take a long time (deselect with '-m not slow')",
    "go: tests requiring the Go toolchain",
    "rust: tests requiring the Rust toolchain",
]

# ── ty ───────────────────────────────────────
[tool.ty.environment]
extra-paths = ["src", ".", "templates/.agent/skills/slice-workflow/cli/src"]

[tool.ty.src]
exclude = ["stacks/**", "templates/**", ".agent/skills/**"]
